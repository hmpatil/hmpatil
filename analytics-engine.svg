<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
    <stop stop-color="#05070B"/>
    <stop offset="0.5" stop-color="#090D16"/>
    <stop offset="1" stop-color="#05070B"/>
  </linearGradient>
  <linearGradient id="cyan" x1="160" y1="0" x2="900" y2="520" gradientUnits="userSpaceOnUse">
    <stop stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#67E8F9"/>
  </linearGradient>
  <linearGradient id="purple" x1="900" y1="0" x2="300" y2="520" gradientUnits="userSpaceOnUse">
    <stop stop-color="#A78BFA"/>
    <stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>
  <linearGradient id="green" x1="300" y1="0" x2="900" y2="520" gradientUnits="userSpaceOnUse">
    <stop stop-color="#34D399"/>
    <stop offset="1" stop-color="#10B981"/>
  </linearGradient>
  <filter id="glowCyan" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowPurple" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" stroke="#1F2937" stroke-opacity=".35"/>
  </pattern>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
  </style>
</defs>

